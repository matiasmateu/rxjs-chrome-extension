<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RxJS Marble Timeline</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0b0f14;
        color: #d6e2f0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          'Apple Color Emoji',
          'Segoe UI Emoji';
      }
      #root {
        height: 100%;
      }
      button {
        font: inherit;
      }
      input,
      button {
        background: none;
      }
      button,
      input,
      select,
      summary,
      [tabindex]:not([tabindex='-1']) {
        outline: none;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      [tabindex]:not([tabindex='-1']):focus-visible {
        box-shadow:
          0 0 0 2px rgba(11, 15, 20, 0.95),
          0 0 0 4px rgba(96, 165, 250, 0.95);
        border-color: rgba(96, 165, 250, 0.95);
      }
      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }
      input::placeholder {
        color: #91a5bf;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="dist/panel.js"></script>
  </body>
</html>
